# Approx: centre-on-edge ties against GDAL intercept rounding (spec: Approx path, Oracle).

[[diff]]
table = "approx"
case = "offset_rect"
cells = [[1, 2], [1, 6], [2, 2], [2, 6], [3, 2], [3, 6], [4, 2], [4, 6], [5, 3], [5, 4], [5, 5], [5, 6]]
reason = "Centre-on-edge tie vs GDAL intercept rounding: the edges x = 2.5 and x = 6.5 and the bottom edge y = 4.5 go through cell centres (each listed centre is within 4e-14 of a cell of an edge). GDAL rounds intercepts to integer pixels, floor(x + 0.5), so it takes a centre on a right edge, and it fills bottom horizontal edges on the centre line. burnscars is left-inclusive (x <= x_mid) and half-open in y (spec: Approx path)."

