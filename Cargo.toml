[package]
name = "controlledburn"
version = "0.2.4"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Sparse scanline rasterization of polygons, lines and points with exact coverage fractions. Pure Rust port of the controlledburn C++ core."
repository = "https://github.com/hypertidy/controlledburn-rs"
keywords = ["raster", "rasterize", "gis", "geospatial", "polygon"]
categories = ["science::geo", "algorithms"]
readme = "README.md"
exclude = [
    ".github/",
    "book/",
    "examples/",
    "rustfmt.toml",
    ".gitignore",
    ".Rproj.user/",
    "*.Rproj",
    ".Rhistory",
    ".RData",
    ".posit/",
]

[features]
default = []
serde = ["dep:serde"]
geo-types = ["dep:geo-types"]
# needs Rust 1.75 (geo-traits uses impl Trait in traits)
geo-traits = ["dep:geo-traits"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
geo-types = { version = "0.7", optional = true }
geo-traits = { version = "0.3", optional = true, default-features = false }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
# float_roundtrip: parse the golden coordinates exactly (the default parser
# can be an ulp off, and lattice cases are decided by single ulps)
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder"] }
criterion = { version = "0.5", default-features = false }
geo = "0.31"
geo-types = "0.7"
geo-traits = { version = "0.3", features = ["geo-types"] }
# a zero-copy geo-traits reader, to check burn_geo_traits against burn_wkb
wkb = "0.9"

[[bench]]
name = "burn"
harness = false
